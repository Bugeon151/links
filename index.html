<title>Bugeon Park · Links</title>

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:title" content="Bugeon Park">
<meta property="og:image" content="https://bugeon-links.vercel.app/profile.jpg">
<meta property="og:description" content="풀스택 AI 개발자 · Team PJ CTO">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 조용하고 정확한 개발자 명함
   IDEA: 잘 인쇄된 흰 명함 한 장, 그 아래 링크가 목록처럼 이어짐
   PICTURE: 굵은 모노그램 B 원형 마크
   COLOUR and TYPE: 흰 배경·검은 글자, 다크는 반전 / Inter
   LAYOUT: 480px 단일 컬럼, 중앙 정렬 */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0b0b0c);--ink:light-dark(#0a0a0a,#f4f4f5);--mute:light-dark(#6b6b70,#9a9aa2);--line:light-dark(#e6e6e8,#26262a);--hov:light-dark(#f5f5f6,#16161a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
main{max-width:480px;margin:0 auto;padding:clamp(40px,8vw,72px) 20px 48px}
.mark{width:96px;height:96px;margin:0 auto 20px;display:block;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
h1{font-size:32px;line-height:1.05;margin:0 0 8px;text-align:center;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.bio{margin:0 0 4px;text-align:center;color:var(--mute)}
.loc{margin:0 0 32px;text-align:center;color:var(--mute);font-size:14px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:8px}
a.l{flex:1;display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;transition:background .15s,border-color .15s,transform .15s}
a.l:hover{background:var(--hov);border-color:var(--ink)}
a.l:active{transform:scale(.99)}
a.l:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a.l svg{width:22px;height:22px;flex:none}
.t{display:flex;flex-direction:column;line-height:1.3}
.t b{font-weight:600}
.t small{color:var(--mute);font-size:13px}
button{width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:12px;background:none;color:var(--mute);cursor:pointer;display:grid;place-items:center}
button:hover{color:var(--ink);border-color:var(--ink)}
button svg{width:18px;height:18px}
footer{margin-top:40px;text-align:center;color:var(--mute);font-size:13px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;transition:.2s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
